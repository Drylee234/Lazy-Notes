<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>Lazy Notes</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="bar">
  <button id="back" class="icon-btn" type="button" aria-label="Back" hidden>‹</button>
  <div class="bar-title">
    <div id="crumb" class="crumb"></div>
    <h1 id="title">Lazy Notes</h1>
  </div>
  <button id="menu-btn" class="icon-btn" type="button" aria-label="Menu" hidden>⋯</button>
  <div id="menu" class="menu" hidden>
    <button type="button" id="refresh">Refresh now</button>
    <button type="button" id="forget">Forget key</button>
  </div>
</header>

<div id="search-wrap" class="search-wrap" hidden>
  <input id="search" type="search" placeholder="Search all notes" autocomplete="off" />
</div>

<main id="view"></main>

<footer id="status" class="status"></footer>

<script src="/static/app.js"></script>
</body>
</html>
