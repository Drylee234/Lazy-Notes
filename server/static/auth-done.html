<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-notes · Signed in</title>
<style>
  :root { --bg: #fff; --pri: #16161a; --sec: #55555f; --accent: #4f46e5; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --pri: #ececf0; --sec: #a1a1aa; --accent: #818cf8; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--pri); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  p { color: var(--sec); max-width: 420px; }
  a { color: var(--accent); }
</style></head>
<body><main><h1 id="t">Signing you in…</h1><p id="m"></p></main>
<script>
  // The extension reads this page's address (#token=…) itself and closes the
  // tab; the phone site keeps the token here (same site) and goes home.
  const q = new URLSearchParams(location.hash.slice(1));
  const t = document.getElementById("t"), m = document.getElementById("m");
  if (q.get("error")) { t.textContent = "Not signed in"; m.textContent = q.get("error"); }
  else if (q.get("from") === "phone") {
    try { localStorage.setItem("ln-key", q.get("token")); localStorage.setItem("ln-user", q.get("user")); } catch (_) {}
    history.replaceState(null, "", "/auth/done");
    location.replace("/app");
  } else {
    t.textContent = "You're signed in";
    m.textContent = `as ${q.get("user")}. Q-notes has it: you can close this tab.`;
  }
</script></body></html>
