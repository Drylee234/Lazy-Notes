<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lazy Notes — How to use</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="stylesheet" href="shared/theme.css" />
<script src="shared/theme.js"></script>
<style>
  body { margin: 0; background: var(--bg); color: var(--pri); font: 14px/1.5 var(--font, system-ui, sans-serif); }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--sec); margin: 0 0 18px; }
  h3 { margin: 24px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--sec); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; }
  td:first-child { width: 36%; white-space: nowrap; }
  kbd { font: 600 12px ui-monospace, monospace; padding: 2px 6px; border: 1px solid var(--border-strong, var(--border)); border-radius: 5px; background: var(--surface, transparent); }
</style>
<script src="shared/brand.js"></script>
</head>
<body>
<main>
  <h1>How to use Lazy Notes</h1>
  <p class="sub">Every shortcut in one place. (In the readers, the <b>?</b> in the Notes panel's title bar shows this too.)</p>
  <div id="list"></div>
</main>
<script src="shared/howto.js"></script>
<script src="shared/howto-page.js"></script>
</body>
</html>
