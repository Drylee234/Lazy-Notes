<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lazy Notes — Notes</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="stylesheet" href="shared/theme.css" />
<link rel="stylesheet" href="notes/notes.css" />
<link rel="stylesheet" href="notes/viewer.css" />
<link rel="stylesheet" href="shared/settings.css" />
<script src="shared/theme.js"></script>
</head>
<body data-page="display">

<header class="topbar">
  <a class="brand" href="courses.html"><img class="logo" src="icons/logo.svg" alt="" width="22" height="22" />Lazy Notes</a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <a class="topbar-link" href="pdfreader.html">Document reader</a>
  <button class="topbar-link topbar-btn" id="open-settings" type="button" aria-haspopup="dialog"><span aria-hidden="true">⚙</span> Settings</button>
</header>

<div id="app">
  <div class="page-head">
    <h1 id="topic-heading"></h1>
    <div class="toolbar">
      <label class="tool">
        <span>Show</span>
        <select id="category-filter" class="select">
          <option value="">All notes</option>
          <option value="header">Headers</option>
          <option value="sub topic">Sub topics</option>
          <option value="definition">Definitions</option>
          <option value="formula">Formulas</option>
          <option value="list head">List heads</option>
          <option value="list point">List points</option>
          <option value="summary">Summaries</option>
          <option value="generic">Generic</option>
          <option value="note">Note: items</option>
        </select>
      </label>
      <label class="tool">
        <span>Order</span>
        <select id="highlight-sort" class="select">
          <option value="chronological">As taken</option>
          <option value="date">Newest first</option>
        </select>
      </label>
      <div class="btn-group" role="group" aria-label="Export">
        <span class="btn-group-label">Export</span>
        <button class="export-btn" data-format="md">Markdown</button>
        <button class="export-btn" data-format="html">HTML</button>
      </div>
    </div>
    <p class="hint">Click a note to edit it.</p>
  </div>

  <main id="highlight-list" class="note-sheet"></main>
</div>

<script src="lib/nspell.js"></script>
<script src="shared/spell.js"></script>
<script src="shared/utils.js"></script>
<script src="notes/exporter.js"></script>
<script src="notes/notes-render.js"></script>
<script src="notes/note-editor.js"></script>
<script src="shared/settings.js"></script>
<script src="notes/viewer.js"></script>
</body>
</html>
