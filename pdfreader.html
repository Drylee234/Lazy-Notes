<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lazy Notes — PDF Reader</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="stylesheet" href="readers/pdfreader.css" />
<link rel="stylesheet" href="readers/embedded-panel.css" />
<link rel="stylesheet" href="readers/quick-note.css" />
<script src="shared/diag.js"></script>
<script src="shared/theme.js"></script>
</head>
<body>

<header id="toolbar">
  <div class="tb-left">
    <button id="outline-btn" class="tb-btn icon" type="button" title="Outline" aria-label="Show outline" aria-pressed="false" hidden>☰</button>
    <a class="tb-logo" href="courses.html" title="All notes"><img src="icons/logo.svg" alt="Lazy Notes" width="22" height="22" /></a>
    <button id="open-btn" class="tb-btn" title="Open a PDF or slides (.pptx)">Open</button>
    <span id="doc-title" class="doc-title">PDF Reader</span>
  </div>

  <div class="tb-center" id="page-controls" hidden>
    <button id="prev-page" class="tb-btn icon" title="Previous page" aria-label="Previous page">‹</button>
    <input id="page-input" type="text" inputmode="numeric" aria-label="Page number" />
    <span id="page-count" class="tb-dim"></span>
    <button id="next-page" class="tb-btn icon" title="Next page" aria-label="Next page">›</button>

    <span class="tb-sep"></span>

    <button id="zoom-out" class="tb-btn icon" title="Zoom out" aria-label="Zoom out">−</button>
    <select id="zoom-mode" class="tb-btn zoom-mode" title="Fit" aria-label="Fit">
      <option value="width">Fit to width</option>
      <option value="page">Fit to page</option>
      <option value="custom" hidden>Custom</option>
    </select>
    <button id="zoom-in" class="tb-btn icon" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="rotate-btn" class="tb-btn icon" type="button" title="Rotate (R · Shift+R the other way)" aria-label="Rotate pages">↻</button>
    <input id="zoom-label" class="zoom-input" type="text" inputmode="numeric" title="Type a zoom (e.g. 125) and press Enter" aria-label="Zoom percent" />

  </div>

  <div class="tb-right">
    <button id="snip-btn" class="tb-btn snip-btn" type="button" title="Save a figure (S): drag a box over a diagram or equation" aria-label="Save a figure" aria-pressed="false" hidden>
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 1v11h11M1 4h11v11"/></svg>
      <span>Snip</span>
    </button>
    <button id="hl-toggle" class="tb-btn hl-toggle" type="button" aria-pressed="true" hidden></button>
    <button id="hl-status" class="hl-status" title="Open the Lazy Notes side panel"></button>
  </div>
</header>

<!-- Outline (the PDF's bookmarks), or a page list when it has none -->
<aside id="outline" hidden>
  <div class="outline-head">Outline</div>
  <nav id="outline-list"></nav>
</aside>

<main id="viewer"></main>

<section id="start-screen" hidden>
  <div class="start-card">
    <h1>Open a document</h1>
    <p class="start-sub">Select text on any page to save it as a note, the same way you do on websites.</p>

    <label id="drop-zone" for="file-input">
      <strong>Choose a PDF, .pptx or .docx</strong>
      <span>or drop one here</span>
    </label>
    <input id="file-input" type="file" accept="application/pdf,.pdf,.pptx,.docx,.doc" hidden />

    <form id="url-form" class="url-form">
      <input id="url-input" type="url" placeholder="…or paste a link to a PDF, .pptx or .docx" />
      <button type="submit" class="tb-btn">Open</button>
    </form>

    <div id="recent" hidden>
      <div class="recent-label">Recent files</div>
      <div id="recent-list"></div>
    </div>

  </div>
</section>

<div id="message" hidden></div>

<script src="readers/pdfreader-host.js"></script>
<script src="readers/docs-recent.js"></script>
<script src="readers/figure-save.js"></script>
<script src="content/content.js"></script>
<script src="lib/nspell.js"></script>
<script src="shared/spell.js"></script>
<script src="readers/doc-words.js"></script>
<script src="readers/quick-note.js"></script>
<script src="readers/embedded-panel.js"></script>
<script type="module" src="readers/pdfreader.js"></script>
</body>
</html>
