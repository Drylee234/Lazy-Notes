<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lazy Notes — Slides</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<!-- Toolbar, start screen and message styles are the PDF reader's, so the
     two readers look and work the same. pptxreader.css adds the slides. -->
<link rel="stylesheet" href="readers/pdfreader.css" />
<link rel="stylesheet" href="readers/pptxreader.css" />
<script src="shared/theme.js"></script>
</head>
<body>

<header id="toolbar">
  <div class="tb-left">
    <a class="tb-logo" href="courses.html" title="All notes"><img src="icons/logo.svg" alt="Lazy Notes" width="22" height="22" /></a>
    <button id="open-btn" class="tb-btn" title="Open slides (.pptx)">Open</button>
    <span id="doc-title" class="doc-title">Slides</span>
  </div>

  <div class="tb-center" id="slide-controls" hidden>
    <button id="prev-slide" class="tb-btn icon" title="Previous slide" aria-label="Previous slide">‹</button>
    <input id="slide-input" type="text" inputmode="numeric" aria-label="Slide number" />
    <span id="slide-count" class="tb-dim"></span>
    <button id="next-slide" class="tb-btn icon" title="Next slide" aria-label="Next slide">›</button>

    <span class="tb-sep"></span>

    <button id="layout-toggle" class="tb-btn" type="button" hidden title="Switch between the slide as laid out and plain text">Text view</button>
    <button id="notes-toggle" class="tb-btn notes-toggle" type="button" aria-pressed="true" hidden>Speaker notes</button>
  </div>

  <div class="tb-right">
    <button id="hl-toggle" class="tb-btn hl-toggle" type="button" aria-pressed="true" hidden></button>
    <button id="hl-status" class="hl-status" title="Open the Lazy Notes side panel"></button>
  </div>
</header>

<main id="viewer"></main>

<section id="start-screen" hidden>
  <div class="start-card">
    <h1>Read slides</h1>
    <p class="start-sub">Open a PowerPoint (.pptx) to read its slides as text. Select text on any slide to save it as a note, the same way you do on websites.</p>

    <label id="drop-zone" for="file-input">
      <strong>Choose a .pptx</strong>
      <span>or drop one here</span>
    </label>
    <input id="file-input" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden />

    <form id="url-form" class="url-form">
      <input id="url-input" type="url" placeholder="…or paste a link to a .pptx" />
      <button type="submit" class="tb-btn">Open</button>
    </form>

    <div id="recent" hidden>
      <div class="recent-label">Recent files</div>
      <div id="recent-list"></div>
    </div>

    <p class="start-foot">
      Older .ppt files can't be read: save them as .pptx (or PDF) in PowerPoint first.
    </p>
  </div>
</section>

<div id="message" hidden></div>

<script src="readers/pptxreader-host.js"></script>
<script src="readers/docs-recent.js"></script>
<script src="readers/figure-save.js"></script>
<script src="content/content.js"></script>
<script type="module" src="readers/pptxreader.js"></script>
</body>
</html>
