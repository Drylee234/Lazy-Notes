<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q-notes — Topics</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="stylesheet" href="shared/theme.css" />
<link rel="stylesheet" href="notes/notes.css" />
<link rel="stylesheet" href="notes/viewer.css" />
<link rel="stylesheet" href="shared/settings.css" />
<script src="shared/diag.js"></script>
<script src="shared/theme.js"></script>
<script src="shared/brand.js"></script>
</head>
<body data-page="topics">

<header class="topbar">
  <a class="brand" href="courses.html"><img class="logo" src="icons/logo.svg" alt="" width="22" height="22" />Q-notes</a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <a class="topbar-link" href="pdfreader.html">Document reader</a>
  <button class="topbar-link topbar-btn" id="open-settings" type="button" aria-haspopup="dialog"><span aria-hidden="true">⚙</span> Settings</button>
</header>

<div id="app">
  <div class="page-head">
    <h1 id="course-heading"></h1>
    <p id="course-meta" class="subtitle"></p>
    <div class="toolbar">
      <label class="tool">
        <span>Sort</span>
        <select id="topic-sort" class="select">
          <option value="chronological">Oldest first</option>
          <option value="name">A–Z</option>
          <option value="highlights">Most notes</option>
        </select>
      </label>
      <div class="btn-group" role="group" aria-label="Export">
        <span class="btn-group-label">Export</span>
        <button class="export-btn" data-format="md">Markdown</button>
        <button class="export-btn" data-format="html">HTML</button>
      </div>
    </div>
  </div>

  <main id="topic-list"></main>
  <section id="course-docs-page">
    <div class="course-docs-head"><h2 class="section-title">Documents in this course</h2>
      <button type="button" id="course-open-doc" class="course-open-doc" title="Open a PDF, slides or Word file: its notes go to this course (you pick the topic)">+ Open a document…</button></div>
    <p id="course-open-doc-msg" class="course-open-doc-msg" hidden></p>
    <div id="course-docs-page-list" class="course-docs-grid"></div>
  </section>
</div>

<script src="lib/nspell.js"></script>
<script src="shared/spell.js"></script>
<script src="shared/utils.js"></script>
<script src="notes/exporter.js"></script>
<script src="notes/notes-render.js"></script>
<script src="notes/note-editor.js"></script>
<script src="shared/ai-providers.js"></script>
<script src="shared/settings.js"></script>
<script src="shared/open-doc.js"></script>
<script src="notes/viewer.js"></script>
</body>
</html>
