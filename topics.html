<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lazy Notes — Topics</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="notes.css" />
<link rel="stylesheet" href="viewer.css" />
</head>
<body data-page="topics">

<header class="topbar">
  <a class="brand" href="courses.html"><img class="logo" src="icons/logo.svg" alt="" width="22" height="22" />Lazy Notes</a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <a class="topbar-link" href="pdfreader.html">PDF reader</a>
</header>

<div id="app">
  <div class="page-head">
    <h1 id="course-heading"></h1>
    <p id="course-meta" class="subtitle"></p>
    <div class="toolbar">
      <label class="tool">
        <span>Sort</span>
        <select id="topic-sort" class="select">
          <option value="chronological">Oldest first</option>
          <option value="name">A–Z</option>
          <option value="highlights">Most notes</option>
        </select>
      </label>
      <div class="btn-group" role="group" aria-label="Export">
        <span class="btn-group-label">Export</span>
        <button class="export-btn" data-format="md">Markdown</button>
        <button class="export-btn" data-format="html">HTML</button>
      </div>
    </div>
  </div>

  <main id="topic-list"></main>
</div>

<script src="utils.js"></script>
<script src="exporter.js"></script>
<script src="notes-render.js"></script>
<script src="viewer.js"></script>
</body>
</html>
