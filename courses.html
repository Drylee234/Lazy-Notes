<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lazy Notes — Courses</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="stylesheet" href="shared/theme.css" />
<link rel="stylesheet" href="notes/notes.css" />
<link rel="stylesheet" href="notes/viewer.css" />
<script src="shared/theme.js"></script>
</head>
<body data-page="courses">

<header class="topbar">
  <a class="brand" href="courses.html"><img class="logo" src="icons/logo.svg" alt="" width="22" height="22" />Lazy Notes</a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <a class="topbar-link" href="pdfreader.html">PDF reader</a>
</header>

<div id="app">
  <div class="page-head">
    <h1>Your courses</h1>
    <div class="search-row">
      <input id="search-input" type="search" placeholder="Search all notes" autocomplete="off" />
    </div>
  </div>

  <section id="recent-docs" aria-labelledby="recent-docs-title">
    <h2 class="section-title" id="recent-docs-title">Continue reading</h2>
    <p class="rd-empty" hidden>PDFs and slides you open will show here.</p>
    <div id="recent-docs-grid"></div>
  </section>

  <h2 class="section-title">Courses</h2>
  <main id="course-list"></main>
  <main id="search-results" hidden></main>
</div>

<script src="lib/nspell.js"></script>
<script src="shared/spell.js"></script>
<script src="shared/utils.js"></script>
<script src="notes/exporter.js"></script>
<script src="notes/notes-render.js"></script>
<script src="notes/note-editor.js"></script>
<script src="notes/viewer.js"></script>
<script src="shared/recent-docs.js"></script>
</body>
</html>
